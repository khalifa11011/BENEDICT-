<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Friends - BENEDICT</title>
<link rel="stylesheet" href="style.css?v=5">

<style>
body{
  margin:0;
  background:#0d0d0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.nearby-header{
  height:62px;
  background:#111113;
  border-bottom:1px solid rgba(212,175,55,.35);
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}

.nearby-back{
  width:38px;
  height:38px;
  border:1px solid rgba(212,175,55,.3);
  border-radius:10px;
  background:#151518;
  color:#d4af37;
  font-size:25px;
}

.nearby-title{
  color:#d4af37;
  font-size:19px;
  font-weight:700;
}

.nearby-content{
  max-width:760px;
  margin:auto;
  padding:24px 14px 40px;
}

.nearby-hero{
  text-align:center;
  padding:20px 10px;
}

.nearby-icon-main{
  font-size:46px;
}

.nearby-hero h1{
  color:#d4af37;
  font-size:25px;
  margin:10px 0;
}

.nearby-hero p{
  color:#999;
  font-size:14px;
  line-height:1.5;
}

.nearby-card{
  background:#151518;
  border:1px solid rgba(212,175,55,.22);
  border-radius:16px;
  overflow:hidden;
  margin-top:18px;
}

.nearby-option{
  width:100%;
  min-height:72px;
  padding:12px 16px;
  background:transparent;
  color:#fff;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.055);
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
}

.nearby-option:last-child{
  border-bottom:0;
}

.nearby-icon{
  font-size:22px;
  width:36px;
  text-align:center;
}

.nearby-text{
  flex:1;
}

.nearby-name{
  display:block;
  font-weight:700;
  font-size:15px;
}

.nearby-desc{
  display:block;
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.nearby-status{
  margin-top:18px;
  padding:15px;
  border:1px solid rgba(212,175,55,.18);
  border-radius:13px;
  background:#111113;
  color:#999;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}

.nearby-privacy{
  color:#d4af37;
  font-weight:600;
}
</style>
</head>

<body>

<header class="nearby-header">
  <button class="nearby-back" onclick="history.back()">‹</button>
  <div class="nearby-title">Nearby Friends</div>
</header>

<main class="nearby-content">

<section class="nearby-hero">
  <div class="nearby-icon-main">👥</div>
  <h1>Nearby Friends</h1>
  <p>
    Discover friends and connections around you while keeping
    your location and privacy under your control.
  </p>
</section>

<section class="nearby-card">

  <button class="nearby-option">
    <span class="nearby-icon">🔎</span>
    <span class="nearby-text">
      <span class="nearby-name">Find Friends Nearby</span>
      <span class="nearby-desc">Discover people who have chosen to be discoverable.</span>
    </span>
    <span>›</span>
  </button>

  <button class="nearby-option">
    <span class="nearby-icon">🟢</span>
    <span class="nearby-text">
      <span class="nearby-name">Friends Online</span>
      <span class="nearby-desc">See which of your friends are currently online.</span>
    </span>
    <span>›</span>
  </button>

  <button class="nearby-option">
    <span class="nearby-icon">📍</span>
    <span class="nearby-text">
      <span class="nearby-name">Location & Privacy</span>
      <span class="nearby-desc">Control whether you can be discovered nearby.</span>
    </span>
    <span>›</span>
  </button>

</section>

<div class="nearby-status">
  <span class="nearby-privacy">Privacy first.</span>
  BENEDICT will not display another person's precise location.
  Nearby discovery should use privacy-protective location ranges instead.
</div>

</main>

</body>
</html>
