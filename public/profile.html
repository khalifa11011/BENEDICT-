/* =========================
   BENEDICT FACEBOOK-STYLE PROFILE
========================= */

body {
  background:
    radial-gradient(circle at 50% 0%, rgba(212,175,55,.08), transparent 32%),
    #080808;
  color: #f5f5f5;
}

.profile-page {
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  padding: 0 0 90px;
}

/* COVER */

.profile-cover {
  position: relative;
  height: 280px;
  background:
    radial-gradient(circle at 50% 30%, rgba(212,175,55,.22), transparent 38%),
    linear-gradient(135deg, #050505, #171717 55%, #080808);
  border-bottom: 1px solid rgba(212,175,55,.35);
  overflow: visible;
}

.profile-cover::after {
  content: "✦ BENEDICT ✦";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(212,175,55,.12);
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 6px;
}

/* PROFILE HEADER */

.profile-main {
  position: relative;
  background:
    linear-gradient(180deg, #151515 0%, #0d0d0d 100%);
  padding: 0 28px 18px;
  border-bottom: 1px solid rgba(212,175,55,.22);
  box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

.profile-avatar-wrap {
  position: relative;
  width: 168px;
  height: 168px;
  margin-top: -84px;
  z-index: 5;
}

.profile-avatar,
.profile-picture {
  width: 168px;
  height: 168px;
  border-radius: 50%;
  object-fit: cover;
  background: #161616;
  border: 5px solid #111111;
  box-shadow: 0 3px 14px rgba(0,0,0,.25);
}

.profile-avatar-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 58px;
  color: #d4af37;
}

/* NAME */

.profile-identity {
  margin-top: 8px;
}

.profile-name {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  color: #f5f5f5;
}

.profile-username {
  margin: 4px 0 8px;
  color: #aaa;
  font-size: 15px;
}

/* BIO */

.profile-bio {
  max-width: 650px;
  margin: 8px 0;
  color: #ddd;
  line-height: 1.5;
}

.profile-details {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
  color: #aaa;
  font-size: 14px;
}

.profile-details a {
  color: #8b6b18;
}

/* ACTIONS */

.profile-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.profile-actions button {
  border: 1px solid #d4af37;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: 700;
}

.profile-actions button:first-child {
  background: #d4af37;
  color: #111;
}

.profile-actions button:last-child {
  background: #f0f2f5;
  color: #222;
}

/* STATS */

.profile-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 20px;
  border-top: 1px solid #e4e6eb;
  padding-top: 14px;
}

.stat {
  min-width: 110px;
  padding: 4px 18px 4px 0;
  text-align: left;
}

.stat strong {
  display: block;
  color: #f5f5f5;
  font-size: 20px;
}

.stat span {
  color: #aaa;
  font-size: 13px;
}

/* PROFILE TABS */

.profile-tabs {
  display: flex;
  overflow-x: auto;
  background: #111111;
  border-bottom: 1px solid rgba(212,175,55,.22);
}

.profile-tabs button {
  flex: 0 0 auto;
  padding: 16px 22px;
  background: transparent;
  color: #aaa;
  border: 0;
  font-weight: 700;
  border-bottom: 3px solid transparent;
}

.profile-tabs button.active {
  color: #8b6b18;
  border-bottom-color: #d4af37;
}

/* CONTENT */

.profile-content {
  padding: 18px 12px;
}

.profile-section {
  background: linear-gradient(180deg, #171717, #101010);
  border: 1px solid rgba(212,175,55,.20);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

.profile-section h2 {
  margin: 0 0 15px;
  color: #f5f5f5;
}

/* POSTS */

.profile-post {
  background: linear-gradient(180deg, #171717, #101010);
  border: 1px solid rgba(212,175,55,.20);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.profile-post p {
  color: #222;
  line-height: 1.5;
}

.profile-post img {
  display: block;
  width: 100%;
  max-height: 600px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 12px;
}

/* EDIT */

.edit-profile {
  display: none;
}

.edit-profile.show {
  display: block;
}

.edit-profile input,
.edit-profile textarea {
  width: 100%;
  margin: 7px 0;
  padding: 12px;
  box-sizing: border-box;
}

.edit-profile button {
  margin-top: 8px;
}

/* MOBILE */

@media (max-width: 600px) {

  .profile-cover {
    height: 190px;

    font-size: 25px;
    letter-spacing: 3px;
  }

  .profile-main {
    padding: 0 14px 16px;
  }

  .profile-avatar-wrap {
    width: 120px;
    height: 120px;
    margin-top: -60px;
  }

  .profile-avatar,
  .profile-picture {
    width: 120px;
    height: 120px;
    border-width: 4px;
  }

  .profile-name {
    font-size: 25px;
  }

  .profile-actions button {
    flex: 1;
    min-width: 130px;
  }

  .stat {
    min-width: 90px;
    padding-right: 10px;
  }

  .profile-tabs button {
    padding: 14px 16px;
  }

  .profile-content {
    padding: 10px 7px;
  }

  .profile-section,
  .profile-post {
    border-radius: 10px;
  }

}

<script>

function getToken() {
  return localStorage.getItem("token");
}


function logoutProfile() {

  localStorage.removeItem("token");

  window.location.href = "/";

}


function showProfileTab(tab, button) {

  document.getElementById("postsTab").style.display =
    tab === "posts" ? "block" : "none";

  document.getElementById("photosTab").style.display =
    tab === "photos" ? "block" : "none";

  document.querySelectorAll(".profile-tabs button")
    .forEach(btn => btn.classList.remove("active"));

  if (button) {
    button.classList.add("active");
  }

}


function setCoverPhoto(path) {

  const cover = document.getElementById("profileCover");

  if (!cover || !path) return;

  cover.style.setProperty(
    "background-image",
    "url('" + path + "?t=" + Date.now() + "')",
    "important"
  );

  cover.classList.add("has-cover");

}


function setProfileAvatar(path) {

  const img = document.getElementById("profileAvatarImage");
  const placeholder = document.getElementById("profileAvatarPlaceholder");

  if (!img || !placeholder) return;

  if (path) {
    img.src = path + "?t=" + Date.now();
    img.style.display = "";
    placeholder.style.display = "none";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
    placeholder.style.display = "";
  }

}


function loadProfilePage() {

  const token = getToken();

  if (!token) {
    window.location.href = "/";
    return;
  }

  const payload = JSON.parse(atob(token.split(".")[1]));

  const params = new URLSearchParams(window.location.search);
  const requestedUserId = params.get("id");

  const profileUserId = requestedUserId || payload.id;


  fetch("/api/users/" + profileUserId)

    .then(res => res.json())

    .then(data => {

      if (!data.user) {
        throw new Error("Profile not found");
      }

      const user = data.user;

      /* COVER PHOTO */

      const cover = document.getElementById("profileCover");

      if (user.coverPhoto) {
        setCoverPhoto(user.coverPhoto);
      } else {
        cover.style.removeProperty("background-image");
        cover.classList.remove("has-cover");
      }



      /* PROFILE PICTURE */

      setProfileAvatar(user.profilePicture);


      /* NAME + BIO */

      document.getElementById("profileIdentity").innerHTML = `

        <div class="profile-identity">

          <h1 class="profile-name">
            ${user.fullName || user.username}
          </h1>

          <div class="profile-username">
            @${user.username}
          </div>

          ${
            user.bio
            ? `<div class="profile-bio">${user.bio}</div>`
            : ""
          }

          <div class="profile-details">

            ${
              user.location
              ? `<span>📍 ${user.location}</span>`
              : ""
            }

            ${
              user.school
              ? `<span>🏫 ${user.school}</span>`
              : ""
            }

            ${
              user.occupation
              ? `<span>💼 ${user.occupation}</span>`
              : ""
            }

            ${
              user.website
              ? `<a href="${user.website}" target="_blank">
                   🔗 Website
                 </a>`
              : ""
            }

            ${
              user.birthday
              ? `<span>
                   🎂 ${new Date(user.birthday).toLocaleDateString()}
                 </span>`
              : ""
            }

          </div>

        </div>

      `;


      /* PROFILE ACTIONS */

      const isOwnProfile =
        String(profileUserId) === String(payload.id);

      const editButton =
        document.getElementById("editProfileButton");

      const followActions =
        document.getElementById("profileFollowActions");

      if (isOwnProfile) {

        editButton.style.display = "inline-block";

        followActions.innerHTML = "";

      } else {

        editButton.style.display = "none";

        const isFollowing =
          Array.isArray(user.followers) &&
          user.followers.some(
            follower =>
              String(follower._id || follower) === String(payload.id)
          );

        followActions.innerHTML = isFollowing
          ? `
            <button
              type="button"
              onclick="unfollowProfileUser('${profileUserId}')">
              ✓ Following
            </button>
          `
          : `
            <button
              type="button"
              onclick="followProfileUser('${profileUserId}')">
              ➕ Follow
            </button>
          `;

      }


      /* FRIEND ACTIONS */

      const friendActions =
        document.getElementById("profileFollowActions");

      if (!isOwnProfile) {

        fetch("/api/friends/status/" + profileUserId, {
          headers: {
            "Authorization": "Bearer " + getToken()
          }
        })
        .then(res => res.json())
        .then(friendData => {

          const status = friendData.status;

          let friendButton = "";

          if (status === "friends") {

            friendButton = `
              <button
                type="button"
                disabled
                style="opacity:.8;cursor:default;">
                🤝 Friends
              </button>
            `;

          } else if (status === "sent") {

            friendButton = `
              <button
                type="button"
                disabled
                style="opacity:.8;cursor:default;">
                🕐 Request Sent
              </button>
            `;

          } else if (status === "received") {

            friendButton = `
              <button
                type="button"
                onclick="acceptProfileFriendRequest('${friendData.requestId}')">
                ✓ Accept Request
              </button>

              <button
                type="button"
                onclick="rejectProfileFriendRequest('${friendData.requestId}')">
                ✕ Reject
              </button>
            `;

          } else {

            friendButton = `
              <button
                type="button"
                onclick="sendProfileFriendRequest('${profileUserId}')">
                👥 Add Friend
              </button>
            `;

          }

          friendActions.insertAdjacentHTML(
            "beforeend",
            `<div class="profile-friend-actions">${friendButton}</div>`
          );

        })
        .catch(err => {
          console.error("Friend status error:", err);
        });

      }

      /* STATS */

      document.getElementById("profileStats").innerHTML = `

        <div class="profile-stats">

          <div class="stat">
            <strong>
              ${user.followers ? user.followers.length : 0}
            </strong>
            <span>Followers</span>
          </div>

          <div class="stat">
            <strong>
              ${user.following ? user.following.length : 0}
            </strong>
            <span>Following</span>
          </div>

          <div class="stat">
            <strong id="profilePostCount">0</strong>
            <span>Posts</span>
          </div>

        </div>

      `;




    })

    .catch(err => {

      console.error(err);

      document.getElementById("profileIdentity").innerHTML =
        "<p>Failed to load profile.</p>";

    });


  /* POSTS */

  fetch("/api/posts")

    .then(res => res.json())

    .then(data => {

      const posts = Array.isArray(data)
        ? data
        : (data.posts || []);

      const myPosts = posts.filter(post => {

        const authorId =
          post.user?._id ||
          post.user ||
          post.author?._id ||
          post.author;

        return String(authorId) === String(profileUserId);

      });


      const postCount =
        document.getElementById("profilePostCount");

      if (postCount) {
        postCount.textContent = myPosts.length;
      }


      document.getElementById("profilePosts").innerHTML =

        myPosts.length

        ? myPosts.map(post => `

            <article class="profile-post">

              ${
                post.content
                ? `<p>${post.content}</p>`
                : ""
              }

              ${
                post.image
                ? `<img src="${post.image}">`
                : ""
              }

            </article>

          `).join("")

        : "<p>No posts yet. Create your first post!</p>";

    })

    .catch(err => {

      console.error(err);

      document.getElementById("profilePosts").innerHTML =
        "<p>Could not load posts.</p>";

    });

}


async function uploadCoverPhoto() {
  const file = document.getElementById("coverPhoto").files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("coverPhoto", file);

  try {
    const res = await fetch("/api/profile/cover-upload", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + getToken()
      },
      body: formData
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || "Cover photo upload failed");
    }

    setCoverPhoto(data.coverPhoto);

  } catch (err) {
    console.error(err);
    alert(err.message || "Cover photo upload failed");
  }
}

async function sendProfileFriendRequest(userId) {

  try {

    const token = getToken();

    if (!token) {
      alert("Please login first.");
      return;
    }

    const res = await fetch("/api/friends/request", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        receiver: userId
      })
    });

    const data = await res.json();

    console.log("FRIEND REQUEST RESPONSE:", res.status, data);

    if (!res.ok) {
      alert(data.message || "Unable to send friend request");
      return;
    }

    loadProfilePage();

  } catch (err) {

    console.error("FRIEND REQUEST ERROR:", err);
    alert("Unable to send friend request");

  }

}


async function acceptProfileFriendRequest(requestId) {

  try {

    const token = getToken();

    const res = await fetch(
      "/api/friends/accept/" + requestId,
      {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    console.log("ACCEPT FRIEND RESPONSE:", res.status, data);

    if (!res.ok) {
      alert(data.message || "Unable to accept request");
      return;
    }

    loadProfilePage();

  } catch (err) {

    console.error("ACCEPT FRIEND ERROR:", err);
    alert("Unable to accept friend request");

  }

}


async function rejectProfileFriendRequest(requestId) {

  try {

    const token = getToken();

    const res = await fetch(
      "/api/friends/reject/" + requestId,
      {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    console.log("REJECT FRIEND RESPONSE:", res.status, data);

    if (!res.ok) {
      alert(data.message || "Unable to reject request");
      return;
    }

    loadProfilePage();

  } catch (err) {

    console.error("REJECT FRIEND ERROR:", err);
    alert("Unable to reject friend request");

  }

}


async function unfollowProfileUser(userId) {

  try {

    const token = getToken();

    if (!token) {
      alert("Please login first.");
      return;
    }

    const res = await fetch("/api/users/" + userId + "/unfollow", {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      }
    });

    const data = await res.json();

    console.log("UNFOLLOW RESPONSE:", res.status, data);

    if (!res.ok) {
      alert(data.error || ("Unfollow failed: HTTP " + res.status));
      return;
    }

    loadProfilePage();

  } catch (err) {

    console.error("UNFOLLOW ERROR:", err);
    alert("Unable to unfollow user: " + err.message);

  }

}


async function followProfileUser(userId) {

  try {

    const res = await fetch("/api/users/" + userId + "/follow", {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + getToken()
      }
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      alert(data.error || "Unable to follow user");
      return;
    }

    alert(data.message || "Following user");

    loadProfilePage();

  } catch (err) {

    console.error(err);
    alert("Unable to follow user");

  }

}


loadProfilePage();
