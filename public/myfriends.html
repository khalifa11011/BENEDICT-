<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Friends</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

.container {
  width: 100%;
  max-width: 800px;
  margin: 20px auto;
}

.card {
  background: #111;
  border: 1px solid rgba(212,175,55,.55);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.45);
}

h2 {
  color: #d4af37;
  margin-top: 0;
}

.friend {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #0a0a0a;
  border: 1px solid rgba(212,175,55,.35);
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
}

.friend img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #d4af37;
}

button {
  min-height: 44px;
  padding: 10px 15px;
  border: 1px solid #d4af37;
  border-radius: 9px;
  background: #1c1c20;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .friend {
    align-items: flex-start;
  }
}
</style>

<script src="/splash.js"></script>
</head>
<body>

<header class="luxury-header">

  <div class="logo">
    <span class="gold">✦ BENEDICT ✦</span>
  </div>

  <nav class="main-nav">
    <button onclick="window.location.href='/'">🏠 Home</button>
    <button onclick="window.location.href='/search.html'">🔍 Search</button>
    <button onclick="window.location.href='/stories.html'">📖 Stories</button>
    <button onclick="window.location.href='/notifications.html'">🔔 Alerts</button>
    <button onclick="window.location.href='/profile.html'">👤 Profile</button>
    <button onclick="window.location.href='/friends.html'">👥 Friends</button>
    <button onclick="window.location.href='/myfriends.html'">🤝 My Friends</button>
  </nav>

</header>

<div class="container">

  <div class="card">

    <h2>👥 My Friends</h2>

    <div id="friends">
      <p>Loading friends...</p>
    </div>

    <br>

    <button onclick="window.location.href='/'">
      ⬅ Back to Home
    </button>

  </div>

</div>

<script src="myfriends.js"></script>

</body>
</html>
