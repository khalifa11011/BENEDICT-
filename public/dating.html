<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating - BENEDICT</title>
<link rel="stylesheet" href="style.css?v=5">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0d0d0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.dating-page{
  min-height:100vh;
  padding-bottom:35px;
}

.dating-header{
  position:sticky;
  top:0;
  z-index:100;
  height:62px;
  background:#111113;
  border-bottom:1px solid rgba(212,175,55,.35);
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}

.dating-back{
  width:38px;
  height:38px;
  border:1px solid rgba(212,175,55,.3);
  border-radius:10px;
  background:#151518;
  color:#d4af37;
  font-size:25px;
}

.dating-title{
  color:#d4af37;
  font-size:19px;
  font-weight:700;
}

.dating-content{
  max-width:700px;
  margin:auto;
  padding:28px 14px 40px;
}

.dating-hero{
  text-align:center;
  padding:25px 15px;
}

.dating-heart{
  font-size:48px;
  margin-bottom:10px;
}

.dating-hero h1{
  margin:0;
  color:#d4af37;
  font-size:25px;
}

.dating-hero p{
  color:#999;
  font-size:14px;
  line-height:1.5;
  margin:10px auto 0;
  max-width:500px;
}

.dating-card{
  background:#151518;
  border:1px solid rgba(212,175,55,.22);
  border-radius:16px;
  overflow:hidden;
  margin-top:18px;
}

.dating-option{
  width:100%;
  min-height:70px;
  padding:12px 16px;
  background:transparent;
  color:#fff;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.055);
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
}

.dating-option:last-child{
  border-bottom:0;
}

.dating-icon{
  width:38px;
  height:38px;
  border:1px solid rgba(212,175,55,.25);
  border-radius:11px;
  background:#111113;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.dating-text{
  flex:1;
}

.dating-name{
  display:block;
  font-weight:700;
  font-size:15px;
}

.dating-desc{
  display:block;
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.dating-status{
  margin-top:20px;
  padding:14px;
  border:1px solid rgba(212,175,55,.18);
  border-radius:13px;
  background:#111113;
  color:#888;
  text-align:center;
  font-size:12px;
}
</style>
</head>

<body>

<div class="dating-page">

<header class="dating-header">
  <button class="dating-back" onclick="history.back()" aria-label="Back">‹</button>
  <div class="dating-title">Dating</div>
</header>

<main class="dating-content">

  <section class="dating-hero">
    <div class="dating-heart">♥</div>
    <h1>BENEDICT Dating</h1>
    <p>
      Meet people, discover connections and build meaningful relationships
      through BENEDICT.
    </p>
  </section>

  <section class="dating-card">

    <button class="dating-option">
      <span class="dating-icon">♥</span>
      <span class="dating-text">
        <span class="dating-name">Discover</span>
        <span class="dating-desc">Explore people and discover new connections.</span>
      </span>
      <span>›</span>
    </button>

    <button class="dating-option">
      <span class="dating-icon">❤</span>
      <span class="dating-text">
        <span class="dating-name">Matches</span>
        <span class="dating-desc">Your mutual connections will appear here.</span>
      </span>
      <span>›</span>
    </button>

    <button class="dating-option">
      <span class="dating-icon">⚙</span>
      <span class="dating-text">
        <span class="dating-name">Dating Preferences</span>
        <span class="dating-desc">Control how your dating experience works.</span>
      </span>
      <span>›</span>
    </button>

  </section>

  <div class="dating-status">
    BENEDICT Dating is being prepared. More features will be added here.
  </div>

</main>

</div>

</body>
</html>
