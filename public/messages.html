<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger | BENEDICT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0d;
  color: #fff;
  font-family: Arial, sans-serif;
}

.luxury-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #0b0b0d;
  border-bottom: 1px solid rgba(212,175,55,.35);
  padding: 14px 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,.45);
}

.logo {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
}

.gold {
  color: #d4af37;
}

.main-nav {
  display: flex;
  gap: 7px;
  margin-top: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.main-nav::-webkit-scrollbar {
  display: none;
}

.main-nav button {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 8px 12px;
  background: #151518;
  color: #fff;
  border: 1px solid rgba(212,175,55,.45);
  border-radius: 10px;
}

.page {
  width: 100%;
  max-width: 700px;
  margin: 18px auto;
  padding: 0 12px 30px;
}

.card {
  background: #151518;
  border: 1px solid rgba(212,175,55,.45);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}

.inbox-title {
  padding: 18px 16px 10px;
}

.inbox-title h1 {
  margin: 0;
  color: #d4af37;
  font-size: 25px;
}

.inbox-title p {
  margin: 5px 0 0;
  color: #999;
  font-size: 13px;
}

.search-box {
  padding: 0 16px 14px;
}

#conversationSearch {
  width: 100%;
  padding: 13px 14px;
  background: #0f0f11;
  color: #fff;
  border: 1px solid rgba(212,175,55,.45);
  border-radius: 12px;
  outline: none;
  font-size: 15px;
}

#conversationSearch:focus {
  border-color: #d4af37;
}

#conversationList {
  border-top: 1px solid rgba(212,175,55,.2);
}

.conversation {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 16px;
  background: transparent;
  color: #fff;
  border: 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
  text-align: left;
  cursor: pointer;
}

.conversation:active {
  background: #1c1c20;
}

.avatar-wrap {
  position: relative;
  flex: 0 0 auto;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  background: #25252a;
  border: 2px solid rgba(212,175,55,.65);
}

.online-dot {
  position: absolute;
  right: 1px;
  bottom: 2px;
  width: 13px;
  height: 13px;
  background: #22c55e;
  border: 2px solid #151518;
  border-radius: 50%;
}

.conversation-main {
  min-width: 0;
  flex: 1;
}

.row-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.username {
  font-weight: 700;
  color: #fff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time {
  color: #777;
  font-size: 11px;
  flex: 0 0 auto;
}

.preview-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
}

.preview {
  flex: 1;
  color: #999;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.unread {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d4af37;
  color: #000;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

.empty,
.loading,
.error {
  padding: 35px 20px;
  text-align: center;
  color: #999;
}

.error {
  color: #e5a3a3;
}

.retry {
  margin-top: 12px;
  padding: 10px 16px;
  background: #1c1c20;
  color: #d4af37;
  border: 1px solid #d4af37;
  border-radius: 10px;
}

@media (max-width: 600px) {
  .luxury-header {
    padding: 11px 10px;
  }

  .logo {
    font-size: 19px;
  }

  .page {
    margin-top: 10px;
    padding-left: 8px;
    padding-right: 8px;
  }

  .card {
    border-radius: 14px;
  }
}
</style>

<script src="/splash.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>

<body>

<header class="luxury-header">

  <div class="logo">
    <span class="gold">✦ BENEDICT ✦</span>
  </div>

  <nav class="main-nav">
    <button onclick="window.location.href='/'">🏠 Home</button>
    <button onclick="window.location.href='/search.html'">🔍 Search</button>
    <button onclick="window.location.href='/stories.html'">📖 Stories</button>
    <button onclick="window.location.href='/notifications.html'">🔔 Alerts</button>
    <button onclick="window.location.href='/profile.html'">👤 Profile</button>
    <button onclick="window.location.href='/friends.html'">👥 Friends</button>
    <button onclick="localStorage.removeItem('token'); window.location.href='/'">🚪 Logout</button>
  </nav>

</header>

<main class="page">

  <section class="card">

    <div class="inbox-title">
      <h1>💬 Messenger</h1>
      <p>Your conversations</p>
    </div>

    <div class="search-box">
      <div
      id="peopleSearchResults"
      style="display:none;">
    </div>

    <input
        id="conversationSearch"
        type="search"
        placeholder="Search conversations..."
        autocomplete="off">
    </div>

    <div id="conversationList">
      <div class="loading">Loading conversations...</div>
    </div>

  </section>

</main>

<script src="/messages.js?v=2"></script>

</body>
</html>
