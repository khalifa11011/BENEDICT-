<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messenger</title>

<script src="/splash.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style id="BENEDICT_CHAT_HORIZONTAL_NAV">
.luxury-header {
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
}

.luxury-header .logo {
  text-align: center;
  padding: 8px 6px 6px;
}

.luxury-header .main-nav {
  display: flex !important;
  flex-wrap: nowrap !important;
  width: 100%;
  box-sizing: border-box;
  gap: 4px;
  padding: 5px 4px 8px;
  overflow: hidden;
}

.luxury-header .main-nav button {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  width: 25% !important;
  box-sizing: border-box;
  margin: 0 !important;
  padding: 10px 2px !important;
  white-space: nowrap !important;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px !important;
  line-height: 1.2;
}

@media (max-width: 600px) {
  .luxury-header .main-nav button {
    font-size: 12px !important;
    padding: 10px 1px !important;
  }
}
</style>

<style id="BENEDICT_MESSAGE_POPUP_MENU">
.benedict-message-popup-menu {
  position: fixed !important;
  z-index: 2147483647 !important;

  display: block !important;

  width: 150px !important;
  min-height: 48px !important;

  box-sizing: border-box !important;

  padding: 5px !important;

  background: #18181c !important;

  border: 2px solid #d4af37 !important;
  border-radius: 12px !important;

  box-shadow: 0 8px 28px rgba(0,0,0,.7) !important;

  pointer-events: auto !important;
}

.benedict-message-popup-menu .benedict-delete-action {
  display: block !important;

  width: 100% !important;

  min-height: 42px !important;

  box-sizing: border-box !important;

  margin: 0 !important;

  padding: 9px 12px !important;

  background: #18181c !important;

  border: 0 !important;
  border-radius: 8px !important;

  color: #ffffff !important;

  font-size: 16px !important;
  font-weight: 600 !important;

  text-align: left !important;

  cursor: pointer !important;

  pointer-events: auto !important;
}

.benedict-message-popup-menu
.benedict-delete-action:active,
.benedict-message-popup-menu
.benedict-delete-action:hover {
  background: rgba(212,175,55,.2) !important;
}
</style>

<style id="BENEDICT_MESSENGER_V2">
:root{--gold:#d4af37;--gold-hi:#f0d675;--gold-lo:#b8902a;--ink:#09090b;--panel:#121215;--panel-2:#1b1b20;--line:rgba(212,175,55,.22);--muted:#9a9aa3;--text:#f4f4f5}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.luxury-header{flex:0 0 auto}
.container{flex:1 1 auto;min-height:0;width:100%;max-width:760px;margin:0 auto;padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.card{height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
button{font:inherit;cursor:pointer;color:inherit}
.luxury-header .gold{color:var(--gold-hi);letter-spacing:.08em}
.luxury-header .main-nav button{min-height:40px;background:#1c1c20;color:#fff;border:1px solid rgba(212,175,55,.45);border-radius:10px}
button:active{transform:scale(.96)}
/* Header */
#chatHeader{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 12px;background:linear-gradient(180deg,#18181c,#131316);border-bottom:1px solid var(--line)}
#chatAvatar{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#202026;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
#chatInfo{flex:1;min-width:0}
#chatTitle{margin:0;font-size:16px;font-weight:700;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatStatus{margin:2px 0 0;font-size:12px;color:var(--muted)}
.icon-btn{flex:0 0 auto;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line);background:#1d1d22;color:var(--gold-hi);font-size:17px;display:grid;place-items:center}
.icon-btn:hover{background:#26262c}
/* Thread */
#messages{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 12px;margin:0;border:0;border-radius:0;
  background:radial-gradient(circle at 20% 0%,rgba(212,175,55,.06),transparent 45%),#0c0c0f;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#messages:empty::before{content:"No messages yet. Say hello.";margin:auto;align-self:center;color:var(--muted);font-size:13px}
#messages .message{flex:0 0 auto;position:relative;width:fit-content;max-width:min(78%,480px);height:auto;margin:0;padding:7px 10px 5px;border-radius:16px;line-height:1.38;font-size:14.5px;overflow-wrap:anywhere;word-break:break-word;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#messages .message.theirs{align-self:flex-start;background:var(--panel-2);color:var(--text);border:1px solid rgba(212,175,55,.16);border-bottom-left-radius:5px}
#messages .message.mine{align-self:flex-end;background:linear-gradient(150deg,#e2c257,#c39a2c);color:#1a1408;border:0;border-bottom-right-radius:5px}
#messages .message + .message.mine,#messages .message + .message.theirs{margin-top:2px}
#messages .message.mine + .message.theirs,#messages .message.theirs + .message.mine{margin-top:8px}
#messages .message .message-text{white-space:pre-wrap}
#messages .message img,#messages .message video{display:block;max-width:min(100%,260px);max-height:320px;width:auto;height:auto;border-radius:12px;margin:2px 0 4px;background:#000}
#messages .message audio{display:block;width:min(240px,62vw);height:40px;margin:2px 0 4px}
.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:2px;font-size:10.5px;line-height:1;opacity:.75;white-space:nowrap}
.message.theirs .msg-meta{color:var(--muted);opacity:1}
.msg-ticks.seen{color:#1d4ed8;opacity:1}
#messages .benedict-three-dot{width:22px;height:22px;min-height:0;padding:0;margin:0 -4px 0 0;border:0;border-radius:50%;background:transparent;color:inherit;font-size:15px;line-height:1;display:inline-grid;place-items:center}
#messages .benedict-three-dot:hover{background:rgba(0,0,0,.12)}
/* Emoji tray */
#emojiPicker{flex:0 0 auto;display:none;margin:0;padding:6px 8px;background:#16161a;border-top:1px solid var(--line);white-space:nowrap;overflow-x:auto}
#emojiPicker span{display:inline-block;padding:6px;font-size:22px;cursor:pointer;border-radius:10px}
#emojiPicker span:hover{background:#24242a}
/* Attachment chip */
#attachChip{flex:0 0 auto;display:none;align-items:center;gap:8px;margin:0;padding:6px 12px;background:#16161a;border-top:1px solid var(--line);font-size:12px;color:var(--gold-hi)}
#attachChip.show{display:flex}
#attachChip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#attachChip button{min-height:0;height:24px;width:24px;padding:0;border:0;border-radius:50%;background:#2a2a30;color:#fff}
/* Composer */
#messageComposer{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin:0;padding:8px;background:#141417;border-top:1px solid var(--line)}
#messageComposer .icon-btn{width:40px;height:40px}
#messageMedia{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#attachBtn{cursor:pointer}
#messageText{flex:1 1 auto;min-width:0;width:auto;height:42px;margin:0;padding:0 14px;border-radius:21px;border:1px solid rgba(212,175,55,.3);background:#1d1d22;color:#fff;font-size:16px;outline:none}
#messageText:focus{border-color:var(--gold)}
#messageText::placeholder{color:#8a8a93}
#recordBtn.recording{background:#7f1d1d;border-color:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(239,68,68,.2)}}
#sendBtn{flex:0 0 auto;height:42px;min-height:0;padding:0 16px;border-radius:21px;border:0;background:linear-gradient(135deg,#ead06a,#c59a2b);color:#17130a;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
@media (max-width:600px){
  .container{padding:0}
  .card{border-radius:0;border-left:0;border-right:0}
  #messages{padding:10px 8px}
  #messages .message{max-width:84%}
  #messageComposer{gap:4px;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
  #messageComposer .icon-btn{width:36px;height:36px;font-size:16px}
  #sendBtn{padding:0 12px}
  #sendBtn .send-label{display:none}
  #sendBtn{width:42px;justify-content:center;padding:0}
}
</style>

</head>

<body>

<header class="luxury-header">

  <div class="logo">
    <span class="gold">✦ BENEDICT ✦</span>
  </div>

  <nav class="main-nav">
    <button onclick="window.location.href='/'">🏠 Home</button>
    <button onclick="window.location.href='/search.html'">🔍 Search</button>
    <button onclick="window.location.href='/stories.html'">📖 Stories</button>
    <button onclick="window.location.href='/notifications.html'">🔔 Alerts</button>
  </nav>

</header>

<div class="container">

<div class="card">

<div id="chatHeader">
  <button type="button" class="icon-btn" onclick="window.location.href='/messages.html'" aria-label="Back to conversations">←</button>
  <div id="chatAvatar">👤</div>

  <div id="chatInfo">
    <h2 id="chatTitle">Messenger</h2>
    <p id="chatStatus">🟢 Online</p>
  </div>

  <button type="button" class="icon-btn" onclick="loadMessages()" aria-label="Refresh messages">↻</button>
</div>

<input
id="receiver"
type="hidden">

<div id="messages"></div>

<div id="emojiPicker" style="display:none;">
  <span onclick="addEmoji('😀')">😀</span>
  <span onclick="addEmoji('😂')">😂</span>
  <span onclick="addEmoji('😍')">😍</span>
  <span onclick="addEmoji('😎')">😎</span>
  <span onclick="addEmoji('🥳')">🥳</span>
  <span onclick="addEmoji('😭')">😭</span>
  <span onclick="addEmoji('😡')">😡</span>
  <span onclick="addEmoji('👍')">👍</span>
  <span onclick="addEmoji('❤️')">❤️</span>
  <span onclick="addEmoji('🔥')">🔥</span>
  <span onclick="addEmoji('🎉')">🎉</span>
  <span onclick="addEmoji('🙏')">🙏</span>
</div>

<div id="attachChip" aria-live="polite">
  <span id="attachName"></span>
  <button type="button" onclick="clearAttachment()" aria-label="Remove attachment">✕</button>
</div>

<div id="messageComposer">

  <button type="button" class="icon-btn" onclick="toggleEmojiPicker()" aria-label="Emoji">😊</button>

  <label id="attachBtn" class="icon-btn" for="messageMedia" aria-label="Attach photo or video">📎</label>
  <input
    id="messageMedia"
    type="file"
    accept="image/*,video/*">

  <input
    id="messageText"
    type="text"
    placeholder="Type a message"
    autocomplete="off"
    enterkeyhint="send">

  <button
    type="button"
    id="recordBtn"
    class="icon-btn"
    onclick="toggleRecording()"
    aria-label="Record voice">🎤</button>

  <button
    type="button"
    id="sendBtn"
    onclick="sendMessage()"
    aria-label="Send"><span class="send-label">Send</span> ➤</button>

</div>

</div>

</div>

<script src="chat.js?v=3"></script>

</body>
</html>
