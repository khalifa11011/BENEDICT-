<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | BENEDICT</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">B</div>

    <h1>Forgot password?</h1>

    <p>Enter your email to reset your password.</p>

    <input id="forgotEmail" type="text" placeholder="Email or phone number">

    <button class="primary-button" onclick="sendReset()">
      Continue
    </button>

    <a class="back-login" href="/">Back to login</a>

    <p id="forgotMessage"></p>

  </div>

</div>

    return;
  }

  const isPhone = /^[+0-9][0-9\s()-]{6,}$/.test(identifier);
  const body = isPhone
    ? { phone: identifier }
    : { email: identifier };

  try {
    const response = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    const data = await response.json();

    message.textContent =
      data.message || "If the account exists, follow the reset instructions.";
  } catch (error) {
    message.textContent = "Unable to process the request.";
  }
}
</script>
