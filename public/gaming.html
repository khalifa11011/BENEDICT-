<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming - BENEDICT</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
body{margin:0;background:#0d0d0f;color:#fff;font-family:Arial,sans-serif}
.gaming-header{height:62px;background:#111113;border-bottom:1px solid rgba(212,175,55,.35);display:flex;align-items:center;padding:0 15px;gap:12px}
.gaming-back{width:38px;height:38px;border:1px solid rgba(212,175,55,.3);border-radius:10px;background:#151518;color:#d4af37;font-size:25px}
.gaming-title{color:#d4af37;font-size:19px;font-weight:700}
.gaming-content{max-width:700px;margin:auto;padding:25px 14px}
.gaming-hero{text-align:center;padding:20px 10px}
.gaming-hero-icon{font-size:48px}
.gaming-hero h1{color:#d4af37;font-size:25px}
.gaming-hero p{color:#999;font-size:14px;line-height:1.5}
.gaming-card{background:#151518;border:1px solid rgba(212,175,55,.22);border-radius:16px;overflow:hidden}
.gaming-option{width:100%;min-height:70px;padding:12px 16px;background:transparent;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.055);display:flex;align-items:center;gap:14px;text-align:left}
.gaming-option:last-child{border-bottom:0}
.gaming-icon{font-size:23px;width:35px;text-align:center}
.gaming-text{flex:1}
.gaming-name{display:block;font-weight:700;font-size:15px}
.gaming-desc{display:block;color:#888;font-size:12px;margin-top:4px}
.gaming-status{margin-top:18px;padding:14px;border:1px solid rgba(212,175,55,.18);border-radius:13px;background:#111113;color:#888;text-align:center;font-size:12px}
</style>
</head>
<body>

<header class="gaming-header">
<button class="gaming-back" onclick="history.back()">‹</button>
<div class="gaming-title">Gaming</div>
</header>

<main class="gaming-content">

<section class="gaming-hero">
<div class="gaming-hero-icon">🎮</div>
<h1>BENEDICT Gaming</h1>
<p>Discover games, compete with friends and enjoy gaming inside BENEDICT.</p>
</section>

<section class="gaming-card">

<button class="gaming-option">
<span class="gaming-icon">🎮</span>
<span class="gaming-text">
<span class="gaming-name">Games</span>
<span class="gaming-desc">Explore games available on BENEDICT.</span>
</span>
<span>›</span>
</button>

<button class="gaming-option">
<span class="gaming-icon">🏆</span>
<span class="gaming-text">
<span class="gaming-name">Leaderboards</span>
<span class="gaming-desc">See scores and achievements.</span>
</span>
<span>›</span>
</button>

<button class="gaming-option">
<span class="gaming-icon">👥</span>
<span class="gaming-text">
<span class="gaming-name">Play With Friends</span>
<span class="gaming-desc">Connect with friends for multiplayer experiences.</span>
</span>
<span>›</span>
</button>

</section>

<div class="gaming-status">
BENEDICT Gaming is being prepared. More games and features will be added here.
</div>

</main>
</body>
</html>
