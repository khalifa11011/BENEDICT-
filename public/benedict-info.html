<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From BENEDICT</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
body{margin:0;background:#0d0d0f;color:#fff;font-family:Arial,sans-serif}
.info{max-width:700px;margin:auto;padding:20px 14px}
.header{height:62px;background:#111113;border-bottom:1px solid rgba(212,175,55,.35);display:flex;align-items:center;padding:0 15px;gap:12px}
.back{width:38px;height:38px;border:1px solid rgba(212,175,55,.3);border-radius:10px;background:#151518;color:#d4af37;font-size:25px}
.title{color:#d4af37;font-size:19px;font-weight:700}
.logo{text-align:center;color:#d4af37;font-size:28px;font-weight:800;letter-spacing:3px;margin:25px 0 8px}
.tag{text-align:center;color:#888;font-size:13px;margin-bottom:25px}
.card{background:#151518;border:1px solid rgba(212,175,55,.22);border-radius:15px;overflow:hidden;margin-bottom:16px}
.item{width:100%;min-height:60px;padding:11px 15px;background:transparent;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.055);display:flex;align-items:center;gap:13px;text-align:left;font-size:15px}
.item:last-child{border-bottom:0}
.icon{color:#d4af37;width:32px;text-align:center;font-size:20px}
.text{flex:1}
.desc{display:block;color:#888;font-size:12px;margin-top:3px}
</style>
</head>
<body>
<header class="header"><button class="back" onclick="history.back()">‹</button><div class="title">From BENEDICT</div></header>
<main class="info">
<div class="logo">✦ BENEDICT ✦</div>
<div class="tag">Connect. Share. Discover.</div>
<div class="card">
<button class="item"><span class="icon">✦</span><span class="text">About BENEDICT<span class="desc">Learn about BENEDICT and its vision</span></span><span>›</span></button>
<button class="item"><span class="icon">✨</span><span class="text">What’s New<span class="desc">See the latest BENEDICT features</span></span><span>›</span></button>
</div>
<div class="card">
<button class="item"><span class="icon">📜</span><span class="text">Community Guidelines<span class="desc">Our community standards</span></span><span>›</span></button>
<button class="item"><span class="icon">🔒</span><span class="text">Privacy Policy<span class="desc">How BENEDICT handles information</span></span><span>›</span></button>
<button class="item"><span class="icon">📄</span><span class="text">Terms of Service<span class="desc">Rules for using BENEDICT</span></span><span>›</span></button>
</div>
</main>
</body>
</html>
