<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories — BENEDICT</title>

<link rel="stylesheet" href="style.css?v=5">
<script src="/splash.js"></script>
</head>

<body>

<header class="luxury-header">

  <div class="logo">
    <span class="gold">✦ BENEDICT ✦</span>
  </div>

  <nav class="main-nav">

    <button onclick="window.location.href='/'">
      🏠 Home
    </button>

    <button onclick="window.location.href='/search.html'">
      🔍 Search
    </button>

    <button onclick="window.location.href='/notifications.html'">
      🔔 Alerts
    </button>

    <button onclick="window.location.href='/friends.html'">
      👥 Friends
    </button>

    <button onclick="window.location.href='/myfriends.html'">
      🤝 My Friends
    </button>

    <button onclick="window.location.href='/profile.html'">
      👤 Profile
    </button>

    <button onclick="localStorage.removeItem('token'); window.location.href='/'">
      🚪 Logout
    </button>

  </nav>

</header>

<main class="container">

  <div class="center">

    <section class="card">

      <h2>📖 Stories</h2>

      <input
        type="file"
        id="storyMedia"
        accept="image/*,video/*"
      >

      <button onclick="uploadStory()">
        ✦ Add Story
      </button>

    </section>

    <section class="card">

      <h2>Recent Stories</h2>

      <div id="stories"></div>

    </section>

  </div>

</main>

<!-- =========================
     STORY VIEWER
========================= -->
<div
  id="storyViewer"
  class="story-viewer"
  style="display:none;"
  role="dialog"
  aria-modal="true"
  aria-label="Story viewer">

  <button
    class="story-viewer-close"
    type="button"
    onclick="closeStory()"
    aria-label="Close story">
    ×
  </button>

  <div
    id="storyContent"
    class="story-viewer-content">
  </div>

</div>

<style>
.story-viewer{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.story-viewer-content{
  width:min(94vw,900px);
  height:min(88vh,900px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-viewer-content img,
.story-viewer-content video{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:12px;
}

.story-viewer-close{
  position:absolute;
  top:18px;
  right:18px;
  width:44px;
  height:44px;
  border:1px solid rgba(212,175,55,.55);
  border-radius:50%;
  background:#111113;
  color:#d4af37;
  font-size:30px;
  line-height:1;
  cursor:pointer;
  z-index:2;
}

.story-viewer-close:active{
  transform:scale(.95);
}
</style>

<script src="/app.js"></script>

<script>
if (!localStorage.getItem("token")) {
  window.location.href = "/";
}
</script>

</body>
</html>
