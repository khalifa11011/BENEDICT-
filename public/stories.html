<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories — BENEDICT</title>

<link rel="stylesheet" href="style.css?v=5">
<script src="/splash.js"></script>

<style id="BENEDICT_STORIES_GOLD_THEME">
.stories-page {
  background: #080808 !important;
  color: #f5f5f5 !important;
  min-height: 100vh;
}
.stories-page .container {
  background: transparent !important;
}
.stories-page .card {
  background: linear-gradient(145deg, #171717, #090909) !important;
  color: #f5f5f5 !important;
  border: 1px solid rgba(212,175,55,.55) !important;
  border-radius: 16px !important;
  box-shadow: 0 8px 28px rgba(0,0,0,.45) !important;
  padding: 20px !important;
  margin-bottom: 20px;
}
.stories-page .card h2 {
  color: #d4af37 !important;
}
.stories-page .card input[type="file"] {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 14px 0;
  padding: 12px;
  color: #f5f5f5 !important;
  background: #111 !important;
  border: 1px solid rgba(212,175,55,.45) !important;
  border-radius: 10px;
}
.stories-page .card input[type="file"]::file-selector-button {
  background: #d4af37;
  color: #080808;
  border: 0;
  border-radius: 7px;
  padding: 9px 12px;
  margin-right: 10px;
  font-weight: 700;
}
.stories-page .card button {
  background: linear-gradient(135deg, #f1d477, #b8860b) !important;
  color: #080808 !important;
  border: 1px solid #d4af37 !important;
  border-radius: 10px !important;
  padding: 11px 20px !important;
  font-weight: 700 !important;
}
.stories-page .main-nav button {
  background: #111 !important;
  color: #d4af37 !important;
  border: 1px solid rgba(212,175,55,.45) !important;
}
.stories-page #stories .story {
  background: #111 !important;
  color: #f5f5f5 !important;
  border: 1px solid rgba(212,175,55,.4) !important;
  border-radius: 12px;
}
.stories-page #stories .story strong,
.stories-page #stories .story p {
  color: #f5f5f5 !important;
}

/* BENEDICT_STORIES_HEADER_FIX */
.stories-page .luxury-header {
  background: linear-gradient(135deg, #080808, #17130a) !important;
  color: #f5f5f5 !important;
  border-bottom: 1px solid #d4af37 !important;
  box-shadow: 0 4px 18px rgba(0,0,0,.55) !important;
}
.stories-page .luxury-header .logo,
.stories-page .luxury-header .gold {
  color: #d4af37 !important;
}
.stories-page .luxury-header .main-nav button {
  background: #111 !important;
  color: #d4af37 !important;
  border: 1px solid rgba(212,175,55,.5) !important;
}

</style>
</head>

<body class="stories-page">

<header class="luxury-header">

  <div class="logo">
    <span class="gold">✦ BENEDICT ✦</span>
  </div>

  <nav class="main-nav">

    <button onclick="window.location.href='/'">
      🏠 Home
    </button>

    <button onclick="window.location.href='/search.html'">
      🔍 Search
    </button>

    <button onclick="window.location.href='/notifications.html'">
      🔔 Alerts
    </button>

    <button onclick="window.location.href='/friends.html'">
      👥 Friends
    </button>

    <button onclick="window.location.href='/myfriends.html'">
      🤝 My Friends
    </button>

    <button onclick="window.location.href='/profile.html'">
      👤 Profile
    </button>

    <button onclick="localStorage.removeItem('token'); window.location.href='/'">
      🚪 Logout
    </button>

  </nav>

</header>

<main class="container">

  <div class="center">

    <section class="card">

      <h2>📖 Stories</h2>

      <input
        type="file"
        id="storyMedia"
        accept="image/*,video/*"
      >

      <button onclick="uploadStory()">
        ✦ Add Story
      </button>

    </section>

    <section class="card">

      <h2>Recent Stories</h2>

      <div id="stories"></div>

    </section>

  </div>

</main>

<!-- =========================
     STORY VIEWER
========================= -->
<div
  id="storyViewer"
  class="story-viewer"
  style="display:none;"
  role="dialog"
  aria-modal="true"
  aria-label="Story viewer">

  <button
    class="story-viewer-close"
    type="button"
    onclick="closeStory()"
    aria-label="Close story">
    ×
  </button>

  <div
    id="storyContent"
    class="story-viewer-content">
  </div>

</div>

<style>
.story-viewer{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.story-viewer-content{
  width:min(94vw,900px);
  height:min(88vh,900px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-viewer-content img,
.story-viewer-content video{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:12px;
}

.story-viewer-close{
  position:absolute;
  top:18px;
  right:18px;
  width:44px;
  height:44px;
  border:1px solid rgba(212,175,55,.55);
  border-radius:50%;
  background:#111113;
  color:#d4af37;
  font-size:30px;
  line-height:1;
  cursor:pointer;
  z-index:2;
}

.story-viewer-close:active{
  transform:scale(.95);
}
</style>

<script src="/app.js"></script>

<script>
if (!localStorage.getItem("token")) {
  window.location.href = "/";
}
</script>

</body>
</html>
