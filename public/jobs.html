<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs - BENEDICT</title>
<link rel="stylesheet" href="style.css?v=5">

<style>
body{
  margin:0;
  background:#0d0d0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.jobs-header{
  height:62px;
  background:#111113;
  border-bottom:1px solid rgba(212,175,55,.35);
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:12px;
}

.jobs-back{
  width:38px;
  height:38px;
  border:1px solid rgba(212,175,55,.3);
  border-radius:10px;
  background:#151518;
  color:#d4af37;
  font-size:25px;
}

.jobs-title{
  color:#d4af37;
  font-size:19px;
  font-weight:700;
}

.jobs-content{
  max-width:760px;
  margin:auto;
  padding:24px 14px 40px;
}

.jobs-hero{
  text-align:center;
  padding:20px 10px;
}

.jobs-icon-main{
  font-size:46px;
}

.jobs-hero h1{
  color:#d4af37;
  font-size:25px;
  margin:10px 0;
}

.jobs-hero p{
  color:#999;
  font-size:14px;
  line-height:1.5;
}

.jobs-card{
  background:#151518;
  border:1px solid rgba(212,175,55,.22);
  border-radius:16px;
  overflow:hidden;
  margin-top:18px;
}

.jobs-option{
  width:100%;
  min-height:72px;
  padding:12px 16px;
  background:transparent;
  color:#fff;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.055);
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
}

.jobs-option:last-child{
  border-bottom:0;
}

.jobs-icon{
  font-size:22px;
  width:36px;
  text-align:center;
}

.jobs-text{
  flex:1;
}

.jobs-name{
  display:block;
  font-weight:700;
  font-size:15px;
}

.jobs-desc{
  display:block;
  color:#888;
  font-size:12px;
  margin-top:4px;
}

.jobs-status{
  margin-top:18px;
  padding:15px;
  border:1px solid rgba(212,175,55,.18);
  border-radius:13px;
  background:#111113;
  color:#999;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<header class="jobs-header">
  <button class="jobs-back" onclick="history.back()">‹</button>
  <div class="jobs-title">Jobs</div>
</header>

<main class="jobs-content">

<section class="jobs-hero">
  <div class="jobs-icon-main">💼</div>
  <h1>BENEDICT Jobs</h1>
  <p>
    Discover career opportunities, connect with employers
    and find your next opportunity.
  </p>
</section>

<section class="jobs-card">

  <button class="jobs-option">
    <span class="jobs-icon">🔎</span>
    <span class="jobs-text">
      <span class="jobs-name">Find Jobs</span>
      <span class="jobs-desc">Search for available opportunities.</span>
    </span>
    <span>›</span>
  </button>

  <button class="jobs-option">
    <span class="jobs-icon">📄</span>
    <span class="jobs-text">
      <span class="jobs-name">My Applications</span>
      <span class="jobs-desc">Keep track of jobs you've applied for.</span>
    </span>
    <span>›</span>
  </button>

  <button class="jobs-option">
    <span class="jobs-icon">🏢</span>
    <span class="jobs-text">
      <span class="jobs-name">For Employers</span>
      <span class="jobs-desc">Post opportunities and find candidates.</span>
    </span>
    <span>›</span>
  </button>

  <button class="jobs-option">
    <span class="jobs-icon">👤</span>
    <span class="jobs-text">
      <span class="jobs-name">My Professional Profile</span>
      <span class="jobs-desc">Build your professional presence on BENEDICT.</span>
    </span>
    <span>›</span>
  </button>

</section>

<div class="jobs-status">
  BENEDICT Jobs is being prepared. Job search and professional features
  will be added here.
</div>

</main>

</body>
</html>
