<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | BENEDICT</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">B</div>

    <h1>Create new account</h1>

    <input id="registerName" type="text" placeholder="Full name">

    <input id="registerUsername" type="text" placeholder="Username">

    <input id="registerEmail" type="email" placeholder="Email (optional)">

    <input id="registerPhone" type="tel" placeholder="Phone number (optional)">

    <input id="registerPassword" type="password" placeholder="Password">

    <button class="primary-button" onclick="registerAccount()">
      Create account
    </button>

    <a class="back-login" href="/">Back to login</a>

    <p id="registerMessage"></p>

  </div>

</div>

<script>
async function registerAccount() {
  const fullName = document.getElementById("registerName").value.trim();
  const username = document.getElementById("registerUsername").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const phone = document.getElementById("registerPhone").value.trim();
  const password = document.getElementById("registerPassword").value;

  const message = document.getElementById("registerMessage");

  if (!fullName || !username || !password || (!email && !phone)) {
    message.textContent = "Enter either an email or phone number.";
    return;
  }

  try {
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fullName,
        username,
        email,
        phone,
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      message.textContent = data.message || "Registration failed.";
      return;
    }

    message.textContent = "Account created successfully.";

    setTimeout(() => {
      window.location.href = "/";
    }, 1000);

  } catch (error) {
    message.textContent = "Unable to create account.";
  }
}
</script>

</body>
</html>
