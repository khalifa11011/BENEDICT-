<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENEDICT - About</title>
<link rel="stylesheet" href="/style.css?v=5">
<style>
body{background:#080808;color:#fff}
.page{max-width:940px;margin:auto;padding-bottom:80px}
.top{padding:22px 16px;border-bottom:1px solid rgba(212,175,55,.25);background:#111}
.top h1{margin:0;color:#d4af37}
.back{margin-top:12px;background:#151515;color:#d4af37;border:1px solid #d4af37;border-radius:8px;padding:10px 16px;font-weight:700}
.card{margin:18px 10px;background:#151515;border:1px solid rgba(212,175,55,.2);border-radius:14px;padding:20px}
.card h2{margin-top:0;color:#fff}
.about-item{padding:15px 0;border-bottom:1px solid #292929}
.about-item:last-child{border-bottom:0}
.about-item strong{display:block;color:#d4af37;margin-bottom:5px}
.about-item p{margin:0;color:#ddd;line-height:1.5}
.empty{color:#aaa}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>✦ BENEDICT ✦</h1>
    <button class="back" onclick="history.back()">← Back to Profile</button>
  </div>

  <div class="card">
    <h2>About</h2>
    <div id="aboutContent"><p class="empty">Loading...</p></div>
  </div>
</div>

<script>
function getToken(){return localStorage.getItem("token");}

async function loadAbout(){
  const token=getToken();
  if(!token){location.href="/";return;}

  try{
    const payload=JSON.parse(atob(token.split(".")[1]));
    const res=await fetch("/api/users/"+payload.id);
    const data=await res.json();

    if(!data.user) throw new Error("Profile not found");

    const u=data.user;
    const items=[];

    if(u.bio) items.push(["📝","Bio",u.bio]);
    if(u.location) items.push(["📍","Current location",u.location]);
    if(u.hometown) items.push(["🏠","Hometown",u.hometown]);
    if(u.school) items.push(["🏫","School",u.school]);
    if(u.occupation) items.push(["💼","Work / Occupation",u.occupation]);
    if(u.relationshipStatus) items.push(["❤️","Relationship status",u.relationshipStatus]);
    if(u.website) items.push(["🔗","Website",u.website]);
    if(u.birthday) items.push(["🎂","Birthday",new Date(u.birthday).toLocaleDateString()]);

    document.getElementById("aboutContent").innerHTML =
      items.length
      ? items.map(x=>`
        <div class="about-item">
          <strong>${x[0]} ${x[1]}</strong>
          <p>${x[2]}</p>
        </div>
      `).join("")
      : '<p class="empty">No About information has been added yet.</p>';

  }catch(e){
    console.error(e);
    document.getElementById("aboutContent").innerHTML =
      '<p class="empty">Unable to load About information.</p>';
  }
}

loadAbout();
</script>
</body>
</html>
