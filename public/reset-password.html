<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BENEDICT</title>
<link rel="stylesheet" href="/style.css">
<style>
  .reset-note {
    color: #aaa;
    font-size: 13px;
    margin: 0 0 18px;
    line-height: 1.5;
  }

  .reset-message {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
  }

  .reset-success {
    color: #d4af37;
  }

  .reset-error {
    color: #ff8a8a;
  }

  .reset-card input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
</style>
</head>

<body>

<div class="auth-page">
  <div class="auth-card reset-card">

    <div class="auth-logo">B</div>

    <h1>Reset password</h1>

    <p class="reset-note">
      Enter the code sent to your email, then choose a new password.
    </p>

    <input
      id="resetEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="resetCode"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit reset code"
      autocomplete="one-time-code"
    >

    <input
      id="newPassword"
      type="password"
      placeholder="New password"
      autocomplete="new-password"
    >

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm new password"
      autocomplete="new-password"
    >

    <button class="primary-button" onclick="resetPassword()">
      Reset password
    </button>

    <a class="back-login" href="/">Back to login</a>

    <p id="resetMessage" class="reset-message"></p>

  </div>
</div>

<script>
function setMessage(text, success = false) {
  const message = document.getElementById("resetMessage");
  message.textContent = text;
  message.className = "reset-message " + (success ? "reset-success" : "reset-error");
}

async function resetPassword() {
  const email = document.getElementById("resetEmail").value.trim();
  const code = document.getElementById("resetCode").value.trim();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!email || !code || !newPassword || !confirmPassword) {
    setMessage("Please complete all fields.");
    return;
  }

  if (newPassword !== confirmPassword) {
    setMessage("Passwords do not match.");
    return;
  }

  if (newPassword.length < 8 || newPassword.length > 128) {
    setMessage("New password must be between 8 and 128 characters.");
    return;
  }

  try {
    const response = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        code,
        newPassword
      })
    });

    const data = await response.json();

    if (!response.ok) {
      setMessage(data.message || "Unable to reset password.");
      return;
    }

    setMessage(
      data.message || "Password reset successful.",
      true
    );

    setTimeout(() => {
      window.location.href = "/";
    }, 1200);

  } catch (error) {
    setMessage("Unable to process the password reset.");
  }
}

const params = new URLSearchParams(window.location.search);
const emailFromRequest = params.get("email");

if (emailFromRequest) {
  document.getElementById("resetEmail").value = emailFromRequest;
}
</script>

</body>
</html>
