<style id="benedict-login-cleanup">
body.benedict-logged-out .luxury-header,
body.benedict-logged-out .bottom-nav,
body.benedict-logged-out .mobile-bottom-nav,
body.benedict-logged-out nav.bottom-navigation {
  display: none !important;
}

/* BENEDICT LOGIN HEADER CLEANUP */
body.benedict-logged-out .benedict-header .header-actions,
html.login-active .benedict-header .header-actions {
  display: none !important;
}

.benedict-language-selector {
  width: 100%;
  display: flex;
  justify-content: center;
  margin: 0 0 8px;
  position: relative;
  z-index: 10;
}

.benedict-language-selector {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  margin: 0 0 4px;
  z-index: 10;
}

.benedict-language-selector select {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  color: #d4af37;
  border: none;
  padding: 3px 20px 3px 6px;
  font-size: 14px;
  font-weight: 600;
  outline: none;
  text-align: center;
  cursor: pointer;
}

.benedict-language-selector::after {
  content: "▼";
  color: #d4af37;
  font-size: 9px;
  position: absolute;
  margin-left: 70px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

.benedict-language-selector select:focus {
  outline: none;
  box-shadow: none;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const loggedIn = !!localStorage.getItem("token");

  if (!loggedIn) {
    document.body.classList.add("benedict-logged-out");

    const logo =
      document.querySelector(".login-logo") ||
      document.querySelector("#loginLogo") ||
      [...document.querySelectorAll("*")].find(el =>
        el.children.length === 0 &&
        el.textContent.trim() === "B"
      );

    if (logo && !document.querySelector(".benedict-language-selector")) {
      const selector = document.createElement("div");
      selector.className = "benedict-language-selector";
      selector.innerHTML = `
        <select aria-label="Select language">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
        </select>
      `;
      logo.parentNode.insertBefore(selector, logo);
    }
  }
});
</script>

<script>
(function () {
  const menuButton = document.getElementById("benedictMenuButton");
  const menu = document.getElementById("benedictMenu");
  const closeButton = document.getElementById("closeBenedictMenu");

  if (!menuButton || !menu || !closeButton) return;

  let savedScrollY = 0;

  function openMenu() {
    savedScrollY = window.scrollY || window.pageYOffset || 0;

    document.documentElement.classList.add("benedict-menu-open");
    document.body.classList.add("benedict-menu-open");

    document.body.style.top = `-${savedScrollY}px`;

    menu.hidden = false;
    menuButton.setAttribute("aria-expanded", "true");
  }

  function closeMenu() {
    menu.hidden = true;

    document.documentElement.classList.remove("benedict-menu-open");
    document.body.classList.remove("benedict-menu-open");

    document.body.style.top = "";

    window.scrollTo(0, savedScrollY);

    menuButton.setAttribute("aria-expanded", "false");
  }

  menuButton.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();

    if (menu.hidden) {
      openMenu();
    } else {
      closeMenu();
    }
  });

  closeButton.addEventListener("click", function (event) {
    event.preventDefault();
    closeMenu();
  });

  document.addEventListener("click", function (event) {
    if (
      !menu.hidden &&
      !menu.contains(event.target) &&
      !menuButton.contains(event.target)
    ) {
      closeMenu();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !menu.hidden) {
      closeMenu();
    }
  });
})();
</script>

<script>
const seeMoreButton = document.getElementById("benedictSeeMore");
const extraGrid = document.getElementById("benedictExtraGrid");

if (seeMoreButton && extraGrid) {
  seeMoreButton.onclick = function () {
    if (extraGrid.style.display === "none") {
      extraGrid.style.display = "grid";
      seeMoreButton.querySelector("label").textContent = "See Less";
      seeMoreButton.querySelector("span").textContent = "⌃";
    } else {
      extraGrid.style.display = "none";
      seeMoreButton.querySelector("label").textContent = "See More";
      seeMoreButton.querySelector("span").textContent = "⌄";
    }
  };
}
</script>
